name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/zinto
            git fetch origin main
            git reset --hard origin/main
            # Both the application and the odontogram package are built on the VPS.
            # Install development dependencies explicitly because Vite/React plugins
            # are required at build time even when NODE_ENV is inherited as production.
            npm ci --include=dev
            npm --prefix packages/pointer-odontogram-module ci --include=dev
            npm run build
            npm run db:migrate:pm2 -- validate
            npm run db:migrate:pm2 -- run
            pm2 restart zinto --update-env
            pm2 save
