name: Deploy to VPS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  verify-api-docs:
    name: Verificar contrato y documentación API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependencias
        run: npm ci --include=dev
      - name: Comprobar documentación API
        run: npm run docs:api:check

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify-api-docs
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/zinto
            git fetch origin main
            git reset --hard origin/main
            # Both the application and the odontogram package are built on the VPS.
            # Install development dependencies explicitly because Vite/React plugins
            # are required at build time even when NODE_ENV is inherited as production.
            npm ci --include=dev
            npm --prefix packages/pointer-odontogram-module ci --include=dev
            npm run build
            npm run db:migrate:pm2 -- validate
            npm run db:migrate:pm2 -- run
            pm2 restart zinto --update-env
            pm2 save
